name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/catalog/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phase 0: publish the static placeholder in web/public. Phase 1 replaces this
      # step with the Astro build (pnpm install && pnpm build --mode demo).
      - name: Assemble site
        run: |
          mkdir -p dist
          cp -r web/public/. dist/
          test -f dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
