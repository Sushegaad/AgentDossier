name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "data/catalog/**", "docs/methodology.md", "config/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Choose the catalog
        # The weekly refresh commits data/catalog. Until the first refresh PR is merged,
        # publish an offline build of the seed workbook so the demo is never empty.
        id: catalog
        run: |
          if [ -f data/catalog/index.json ]; then
            echo "dir=$PWD/data/catalog" >> "$GITHUB_OUTPUT"
          else
            uv sync --extra connectors
            uv run agentdossier build --sources seed --offline --no-review --out build/catalog
            echo "dir=$PWD/build/catalog" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the site
        working-directory: web
        env:
          CATALOG_DIR: ${{ steps.catalog.outputs.dir }}
          SITE_BASE: /AgentDossier
          SITE_URL: https://sushegaad.github.io
          PUBLIC_GA_ID: G-H3M4PC9X93  # public demo only; consent mode, cookieless until opted in
        run: |
          npm ci
          npm run build
          test -f dist/index.html && test -f dist/catalog/index.json
      - name: Package the site for Pages
        # The same tar upload-pages-artifact makes, but uploaded with overwrite so that
        # re-running a run never leaves two "github-pages" artifacts for deploy-pages to find.
        run: tar --dereference --hard-dereference --directory web/dist -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
