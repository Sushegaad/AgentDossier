name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra server --extra mcp
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy agentdossier
      - name: Config and schema check
        run: uv run agentdossier config-check
      - name: Seed fidelity (FR-16)
        run: uv run agentdossier seed-check data/seed/top_100_ai_agents_by_domain_2026-09-25.xlsx
      - name: Tests
        run: uv run pytest -q --cov=agentdossier --cov-report=term-missing
      - name: BRD traceability
        run: uv run python scripts/check_traceability.py
      - name: Enterprise self-test (loopback)
        run: uv run agentdossier enterprise selftest

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Offline catalog for the build (seed workbook only)
        run: |
          uv sync --extra connectors
          uv run agentdossier build --sources seed --offline --no-review --out build/catalog
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npm run check
      - name: Unit tests (intent parser, search, precision@10)
        working-directory: web
        env:
          CATALOG_DIR: ../build/catalog
        run: npm test
      - name: Build
        working-directory: web
        env:
          CATALOG_DIR: ../build/catalog
        run: npm run build
      - name: Smoke-check the output
        run: test -f web/dist/index.html && test -f web/dist/catalog/index.json && test -f web/dist/.well-known/ard.json
      - name: Browser for the audit
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Launch gates (axe WCAG 2.1 AA, Lighthouse >= 85/95/90/90)
        working-directory: web
        run: npm run audit

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists the PR's commits on pull_request events
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # gitleaks scans the base..head commit range, so the base must be present
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
      - name: pip-audit (locked third-party dependencies)
        run: |
          uv export --extra dev --no-emit-project --format requirements-txt --frozen > /tmp/requirements.txt
          uv run --with pip-audit pip-audit --strict --desc -r /tmp/requirements.txt
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v3.16.2
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/agentdossier
          helm template ref deploy/helm/agentdossier \
            --set ingress.enabled=true --set secrets.AGENTDOSSIER_API_TOKEN=r \
            --set-file enterpriseConfig=examples/enterprise/enterprise.json > /tmp/rendered.yaml
          python3 -c "import yaml; docs=[d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]; print([d['kind'] for d in docs]); assert len(docs) == 7"

  image:
    name: container image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build from the lockfile (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: agentdossier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image refuses to start without an auth mode, and starts with one
        run: |
          set -e
          if docker run --rm agentdossier:ci python -c "from agentdossier.server.app import create_app; create_app()" 2>/dev/null; then echo "started without AGENTDOSSIER_AUTH_MODE"; exit 1; fi
          docker run --rm -e AGENTDOSSIER_AUTH_MODE=token -e AGENTDOSSIER_API_TOKEN=t agentdossier:ci python -c "from agentdossier.server.app import create_app; create_app(); print('ok')"
          docker run --rm agentdossier:ci agentdossier --help | head -1
