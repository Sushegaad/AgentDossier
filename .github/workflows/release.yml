name: release

# Tag a release (git tag v1.0.0 && git push --tags) to publish:
#   * the Python wheel and sdist (attached to the GitHub release)
#   * the container image ghcr.io/sushegaad/agentdossier:<tag> and :latest, signed with
#     cosign (keyless, Sigstore) and carrying a CycloneDX SBOM attestation
#   * the Helm chart (.tgz) and an SPDX SBOM of the repository
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agentdossier

jobs:
  python:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-dist
          path: dist/*

  image:
    name: container image (signed, SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless cosign signing
      attestations: write  # build provenance
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
      - name: Attest the SBOM to the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate image-sbom.cdx.json "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: image-sbom
          path: image-sbom.cdx.json

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v3.16.2
      - run: |
          helm lint deploy/helm/agentdossier
          helm package deploy/helm/agentdossier --destination chart-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: helm-chart
          path: chart-dist/*.tgz

  release:
    name: GitHub release
    needs: [python, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and attach files
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/repository-sbom.spdx.json
      - name: Release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v tag="$tag" '
            /^## / { if (found) exit; if (index($0, "[" tag "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}" > notes.md
          echo "Image: ${IMAGE}@${{ needs.image.outputs.digest }} (cosign-signed; verify with \`cosign verify --certificate-identity-regexp github.com/${{ github.repository }} --certificate-oidc-issuer https://token.actions.githubusercontent.com ${IMAGE}@${{ needs.image.outputs.digest }}\`)" >> notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          body_path: notes.md
          files: |
            artifacts/python-dist/*
            artifacts/helm-chart/*
            artifacts/image-sbom/*
            artifacts/repository-sbom.spdx.json
