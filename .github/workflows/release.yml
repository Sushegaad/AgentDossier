name: release

# Tag a release (git tag v1.0.0 && git push --tags) to publish:
#   * the Python wheel and sdist (attached to the GitHub release)
#   * the container image ghcr.io/sushegaad/agentdossier:<tag> and :latest, signed with
#     cosign (keyless, Sigstore) and carrying a CycloneDX SBOM attestation
#   * the Helm chart (.tgz) and an SPDX SBOM of the repository
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agentdossier

jobs:
  python:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  image:
    name: container image (signed, SBOM)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
      - name: Attest the SBOM to the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate image-sbom.cdx.json "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: image-sbom
          path: image-sbom.cdx.json

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: |
          helm lint deploy/helm/agentdossier
          helm package deploy/helm/agentdossier --destination chart-dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: chart-dist/*.tgz

  release:
    name: GitHub release
    needs: [python, image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/repository-sbom.spdx.json
      - name: Release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v tag="$tag" '
            /^## / { if (found) exit; if (index($0, "[" tag "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}" > notes.md
          echo "Image: ${IMAGE}@${{ needs.image.outputs.digest }} (cosign-signed; verify with \`cosign verify --certificate-identity-regexp github.com/${{ github.repository }} --certificate-oidc-issuer https://token.actions.githubusercontent.com ${IMAGE}@${{ needs.image.outputs.digest }}\`)" >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artifacts/python-dist/*
            artifacts/helm-chart/*
            artifacts/image-sbom/*
            artifacts/repository-sbom.spdx.json
