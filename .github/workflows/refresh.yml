name: refresh

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC (BRD v3.1: weekly refresh)
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap discovered resources per source (leave empty for a full run)"
        required: false
        default: ""
      news_limit:
        description: "Cap resources searched for news/CVEs (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # NVD allows 5 requests / 30 s without NVD_API_KEY
    permissions:
      contents: write        # push the refresh branch
      pull-requests: write   # open the catalog PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Restore raw snapshots (never committed)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/snapshots
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-
      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          NEWS_LIMIT="${{ github.event.inputs.news_limit }}"
          # 150-minute budget inside the 180-minute job limit: stages that run out of time
          # skip their remaining items and say so in the report, so a PR is always produced.
          uv run agentdossier build --out data/catalog --cache build/snapshots --budget-minutes 150 \
            ${LIMIT:+--limit $LIMIT} ${NEWS_LIMIT:+--news-limit $NEWS_LIMIT}
      - name: Validate outputs
        run: uv run python scripts/validate_catalog.py data/catalog
      - name: Summarize for the PR body
        id: summary
        run: |
          uv run python scripts/catalog_summary.py data/catalog > /tmp/pr-body.md
          echo "body<<EOF" >> "$GITHUB_OUTPUT"; cat /tmp/pr-body.md >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: refresh/catalog
          title: "data: weekly catalog refresh ${{ github.run_started_at }}"
          commit-message: "data: weekly catalog refresh"
          body: ${{ steps.summary.outputs.body }}
          labels: catalog-refresh
          add-paths: |
            data/catalog/**
            data/review/**
            data/changelog/**
          delete-branch: true
