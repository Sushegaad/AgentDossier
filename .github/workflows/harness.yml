name: harness

# Run a published prompt-injection benchmark (AgentDojo) against a model and record the result as
# a trace. Monthly, or on demand. Needs a model backend; the attack scenarios and the success
# check are AgentDojo's, not authored here. Opens a PR with the new bundles under data/traces/.

on:
  schedule:
    - cron: "0 7 1 * *"   # the 1st of each month, 07:00 UTC
  workflow_dispatch:
    inputs:
      model:
        description: "Model key from data/traces/harness/models.yaml"
        required: true
        default: "gpt-4o-mini"
      suite:
        description: "AgentDojo suite (leave empty for all)"
        required: false
        default: ""
      attack:
        description: "AgentDojo attack name"
        required: false
        default: "important_instructions"

permissions:
  contents: read

jobs:
  run-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra harness
      - name: Run the injection benchmark
        env:
          # Set whichever provider the chosen model uses; the harness reads keys from here only.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AGENTDOSSIER_HARNESS_BASE_URL: ${{ secrets.AGENTDOSSIER_HARNESS_BASE_URL }}
          AGENTDOSSIER_HARNESS_MODEL: ${{ secrets.AGENTDOSSIER_HARNESS_MODEL }}
        run: |
          MODEL="${{ github.event.inputs.model || 'gpt-4o-mini' }}"
          SUITE="${{ github.event.inputs.suite }}"
          ATTACK="${{ github.event.inputs.attack || 'important_instructions' }}"
          uv run agentdossier harness run --model "$MODEL" --attack "$ATTACK" ${SUITE:+--suite "$SUITE"}
      - name: Verify the trace store chain
        run: uv run python scripts/verify_traces.py
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: traces/harness
          title: "traces: harness run"
          commit-message: "traces: record prompt-injection benchmark run"
          body: "Automated AgentDojo prompt-injection run. Bundles are model-level traces; review before merge."
          labels: traces
          delete-branch: true
          add-paths: |
            data/traces/**
