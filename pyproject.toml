[project]
name = "agentdossier"
version = "1.0.0"
description = "AgentDossier: a standards-aware AI agent registry with an evidence dossier for every agent (ARD, A2A, MCP)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hemant Naik" }]
requires-python = ">=3.11"
keywords = ["ai-agents", "registry", "ard", "a2a", "mcp", "compliance", "trust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
# The core is standard-library only. Everything below is optional.
dependencies = []

[project.optional-dependencies]
connectors = ["openpyxl>=3.1", "feedparser>=6.0", "rapidfuzz>=3.9", "dnspython>=2.6"]
server = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.5",
  "authlib>=1.3", "apscheduler>=3.10", "itsdangerous>=2.2",
]
mcp = ["mcp>=1.2"]
dev = [
  "pytest>=8.3", "pytest-cov>=5", "hypothesis>=6.112", "ruff>=0.6", "mypy>=1.11",
  "openpyxl>=3.1", "jsonschema>=4.23", "pyyaml>=6.0",
]

[project.scripts]
agentdossier = "agentdossier.cli:main"
agentreg = "agentdossier.cli:main"

[project.urls]
Homepage = "https://sushegaad.github.io/AgentDossier/"
Repository = "https://github.com/Sushegaad/AgentDossier"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdossier"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101", "S310", "S324", "E501"]
per-file-ignores = { "tests/*" = ["S", "B"], "agentdossier/server/app.py" = ["B008"], "agentdossier/server/routers/*" = ["B008"] }

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
files = ["agentdossier"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
