[project]
name = "agentdossier"
version = "1.0.0"
description = "AgentDossier: a standards-aware AI agent registry with an evidence dossier for every agent (ARD, A2A, MCP)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hemant Naik" }]
requires-python = ">=3.11"
keywords = ["ai-agents", "registry", "ard", "a2a", "mcp", "compliance", "trust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
# The core is standard-library only. Everything below is optional.
dependencies = []

[project.optional-dependencies]
connectors = ["openpyxl>=3.1.5", "feedparser>=6.0.14", "rapidfuzz>=3.14.6", "dnspython>=2.8.0"]
server = [
  "fastapi>=0.142.2", "uvicorn[standard]>=0.54.0", "pydantic>=2.13.5", "sqlalchemy>=2.1.1",
  "alembic>=1.20.0", "authlib>=1.8.0", "psycopg[binary]>=3.3.6", "apscheduler>=3.11.3",
  "cryptography>=50.0.2", "slowapi>=0.1.10", "itsdangerous>=2.2",
]
mcp = ["mcp>=2.2.0"]
dev = [
  "pytest>=9.1.1", "pytest-cov>=7.1.0", "hypothesis>=6.168.3", "ruff>=0.16.10", "mypy>=2.4.0",
  "openpyxl>=3.1.5", "jsonschema>=4.26.0", "pyyaml>=6.0.3",
]

[project.scripts]
agentdossier = "agentdossier.cli:main"
agentreg = "agentdossier.cli:main"

[project.urls]
Homepage = "https://sushegaad.github.io/AgentDossier/"
Repository = "https://github.com/Sushegaad/AgentDossier"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdossier"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101", "S310", "S324", "E501"]
per-file-ignores = { "tests/*" = ["S", "B"], "agentdossier/server/app.py" = ["B008"] }

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
files = ["agentdossier"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# slowapi depends on `deprecated`, whose source uses the 3.12 `type` statement; mypy
# must not follow imports into it while this project targets 3.11.
module = ["slowapi", "slowapi.*", "deprecated", "deprecated.*", "wrapt", "wrapt.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
