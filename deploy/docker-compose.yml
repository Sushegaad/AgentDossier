# Self-hosted AgentDossier. Copy enterprise.json next to this file, set the secrets in .env,
# then: docker compose up -d
services:
  agentdossier:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agentdossier:latest
    ports:
      - "8080:8080"
    volumes:
      - agentdossier-data:/data
      - ./enterprise.json:/config/enterprise.json:ro
      # - /etc/ssl/corp-root-ca.pem:/config/corp-root-ca.pem:ro
    environment:
      AGENTDOSSIER_ENTERPRISE_CONFIG: /config/enterprise.json
      AGENTDOSSIER_SITE: ${AGENTDOSSIER_SITE:-http://localhost:8080/}
      AGENTDOSSIER_TRUSTED_PROXIES: ${AGENTDOSSIER_TRUSTED_PROXIES:-}
      AGENTDOSSIER_SCAN_ON_START: "1"
      # --- auth: pick one ---------------------------------------------------------
      # token mode (API clients, CI):
      AGENTDOSSIER_AUTH_MODE: ${AGENTDOSSIER_AUTH_MODE:-token}
      AGENTDOSSIER_API_TOKEN: ${AGENTDOSSIER_API_TOKEN:?set a reader token in .env}
      AGENTDOSSIER_ADMIN_TOKEN: ${AGENTDOSSIER_ADMIN_TOKEN:-}
      # oidc mode (browser login through your IdP):
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-agentdossier-admins}
      OIDC_REVIEWER_GROUP: ${OIDC_REVIEWER_GROUP:-agentdossier-reviewers}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # --- scanner credentials referenced by enterprise.json auth.headers_from_env ----
      AGENTREG_INTERNAL_TOKEN: ${AGENTREG_INTERNAL_TOKEN:-}
      # --- notifications (see .env.example) ----------------------------------------------
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-1}
      AGENTDOSSIER_NOTIFY_EMAIL: ${AGENTDOSSIER_NOTIFY_EMAIL:-}
      AGENTDOSSIER_WEBHOOK_URL: ${AGENTDOSSIER_WEBHOOK_URL:-}
      AGENTDOSSIER_WEBHOOK_SECRET: ${AGENTDOSSIER_WEBHOOK_SECRET:-}
      AGENTDOSSIER_NOTIFY_EVENTS: ${AGENTDOSSIER_NOTIFY_EVENTS:-}
      AGENTDOSSIER_EXPIRY_CRON: ${AGENTDOSSIER_EXPIRY_CRON:-0 7 * * *}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Task}
      SERVICENOW_INSTANCE_URL: ${SERVICENOW_INSTANCE_URL:-}
      SERVICENOW_USER: ${SERVICENOW_USER:-}
      SERVICENOW_PASSWORD: ${SERVICENOW_PASSWORD:-}
      SERVICENOW_TABLE: ${SERVICENOW_TABLE:-incident}
      GRC_WEBHOOK_URL: ${GRC_WEBHOOK_URL:-}
      GRC_WEBHOOK_SECRET: ${GRC_WEBHOOK_SECRET:-}
      AGENTDOSSIER_EXPIRY_WARNING_DAYS: ${AGENTDOSSIER_EXPIRY_WARNING_DAYS:-30}
      AGENTDOSSIER_FEDERATION_PEERS: ${AGENTDOSSIER_FEDERATION_PEERS:-}
      AGENTDOSSIER_FEDERATION_MODE: ${AGENTDOSSIER_FEDERATION_MODE:-referrals}
      AGENTDOSSIER_FEDERATION_TOKEN: ${AGENTDOSSIER_FEDERATION_TOKEN:-}
      SCIM_TOKEN: ${SCIM_TOKEN:-}
      AGENTDOSSIER_RATE_LIMIT: ${AGENTDOSSIER_RATE_LIMIT:-120/minute}
      AGENTDOSSIER_BEHIND_TLS_PROXY: ${AGENTDOSSIER_BEHIND_TLS_PROXY:-0}
      # --- optional --------------------------------------------------------------------
      NVD_API_KEY: ${NVD_API_KEY:-}
    restart: unless-stopped
volumes:
  agentdossier-data:
