apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentdossier.fullname" . }}
  labels:
    {{- include "agentdossier.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate   # one writer on the data volume
  selector:
    matchLabels:
      {{- include "agentdossier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentdossier.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.enterpriseConfig | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentdossier.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agentdossier
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AGENTDOSSIER_ENTERPRISE_CONFIG
              value: /config/enterprise.json
            - name: AGENTDOSSIER_DB
              value: /data/agentdossier.db
            - name: AGENTDOSSIER_CATALOG_DIR
              value: /data/catalog
            - name: HOME
              value: /tmp
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "agentdossier.secretName" . }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config/enterprise.json
              subPath: enterprise.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.caBundle.configMap }}
            - name: ca
              mountPath: /config/corp-root-ca.pem
              subPath: ca.crt
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "agentdossier.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "agentdossier.configMapName" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.caBundle.configMap }}
        - name: ca
          configMap:
            name: {{ .Values.caBundle.configMap }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
