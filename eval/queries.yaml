version: eval-queries-1.0
notes: >-
  Hand-labelled precision@10 set (plan section 9, P1d gate). Each query names the resources a
  practitioner would expect in the top ten, judged from the seed workbook's own categories and
  descriptions. precision@10 = |top10 ∩ relevant| / min(10, |relevant|), averaged over queries.
  Labelled 2026-09-27 by the maintainer with assistant help; edit freely, this file is the gate.
  Queries marked "hard" exercise a must-have or a protocol chip and are expected to auto-relax on a
  seed-only catalog.
threshold: 0.8
max_drop: 0.05
