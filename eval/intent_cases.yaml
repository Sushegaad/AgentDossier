version: intent-cases-1.0
notes: '54 cases: the three BRD examples plus hand-written variants covering every dimension (domain, capability, data class,
  deployment, compliance, protocol, ecosystem, jurisdiction, trust) and the must-have/prefer chips. Gate: every expected chip
  present (>=95% of cases).'
