      A crafted email the user never opens is retrieved by Microsoft 365 Copilot's RAG and instructs
      it to embed sensitive context in an image URL fetched through an allowed Microsoft domain,
      bypassing the content-security policy. No user interaction. Microsoft fixed it server-side
