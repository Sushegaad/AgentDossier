    title: "Visual Studio Copilot and SSMS Remote Code Execution (CVE-2026-103572)"
    date: 2026-10-13
    window: "August-October 2026"
    ai_role: target
    category: red_team
    summary: >-
      A researcher reported that Copilot in Visual Studio and SQL Server Management Studio could
      bypass a file path validation check using a trailing dot in a filename and write to its own MCP
      and settings configuration files. This let a misaligned or hijacked agent escape containment and
      run arbitrary commands. The researcher demonstrated exploitation via indirect prompt injection
      against a Microsoft model, popping calc.exe in Visual Studio 2026 and running a malicious MCP
      server in SSMS. Microsoft classified it as an Important severity remote code execution flaw and
      shipped a patch.
