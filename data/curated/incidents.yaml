    defender:
      description: "No vendor patch; mitigation is least-privilege scoping and runtime guardrails (per the write-up)"
    scale: "Any private repository reachable by the connected account"
    impact: "Cross-repository leak of private source and details via a public PR"
    tactics: [TA0001, TA0009, TA0010]
