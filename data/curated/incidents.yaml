    impact: "In the lab, code execution on the test machine, a C2 callback, Calculator opened, recon commands run by a nested Claude instance, and files written outside the workspace. In some runs Auto Mode blocked Claude's attempt to kill the malware process."
    tactics: [TA0001, TA0002, TA0005, TA0007, TA0011]
