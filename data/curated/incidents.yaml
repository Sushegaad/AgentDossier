  - id: TR-2026-008
    status: published
    title: "s1ngularity: npm-borne malware drives developers' own AI CLIs (Claude, Gemini, Q) to hunt for secrets"
    date: 2025-08-26
    window: "Malicious Nx packages published 26 Aug 2025; GitHub disabled the exfil repos 27 Aug; a second wave ran 28-29 Aug"
    ai_role: attacker
    category: incident
    summary: >-
      Malicious versions of the Nx build package shipped a postinstall script that, on developer
      machines and in CI, invoked locally installed AI command-line agents — Claude, Gemini and
      Amazon Q — with permission-skipping flags (--dangerously-skip-permissions, --yolo,
      --trust-all-tools) and prompted them to enumerate the filesystem for wallets, keystores, .env
      files and SSH keys. Wiz observed the AI-assisted reconnaissance succeed in hundreds of cases
      (provider guardrails sometimes intervened). Harvested tokens were base64-encoded into
      attacker-created public GitHub repos; a second wave used leaked tokens to flip victims' private
      repositories public. This is a trace of AI agents turned into the attacker's reconnaissance tool.
    attacker:
      description: "Unknown operator; malware that weaponised the victims' installed AI CLIs"
    defender:
      description: "GitHub and npm — disabled the exfil repos and removed the packages; vendors' agent guardrails caught some runs"
    scale: "Phase one: 1,000+ GitHub tokens and ~20,000 files; phase two: 400+ users/orgs and 5,500+ repos made public (Wiz)"
    impact: "AI-assisted credential and secret theft at scale, plus forced exposure of private repositories"
    tactics: [TA0043, TA0006, TA0009, TA0010]
    timeline:
      - { date: "2025-08-26", text: "Malicious Nx versions published to npm; the postinstall script prompts installed AI CLIs to find secrets", tier: 2, source: "1" }
      - { date: "2025-08-27", text: "GitHub disables the s1ngularity exfiltration repositories (~8-hour exposure window)", tier: 2, source: "1" }
      - { date: "2025-08-28", text: "A second wave uses leaked tokens to make victims' private repositories public (400+ orgs, 5,500+ repos)", tier: 2, source: "1" }
    lessons:
      - "A capable AI CLI on a developer's machine becomes an attack tool once code can invoke it — treat permission-skipping flags as a privilege, not a convenience."
      - "Provider guardrails refused some of the malicious prompts; that layer is worth keeping, but it is probabilistic, not a control."
      - "Secrets reachable to a shell are reachable to an agent the shell can launch; scope what a developer agent is allowed to read."
    models_named:
      - { name: "Claude", role: "attacker", note: "invoked by the malware with --dangerously-skip-permissions" }
      - { name: "Gemini", role: "attacker", note: "invoked with --yolo" }
      - { name: "Amazon Q", role: "attacker", note: "invoked with --trust-all-tools" }
    related_agents: [anthropic-claude-code, google-gemini-cli, aws-amazon-q-developer]
    vendor_response: "GitHub disabled the repos; npm removed the packages; Nx published clean releases and guidance"
    sources:
      - { title: "s1ngularity: supply chain attack leaks secrets on GitHub: everything you need to know", url: "https://www.wiz.io/blog/s1ngularity-supply-chain-attack", outlet: "Wiz", date: "2025-08-27" }
      - { title: "The s1ngularity attack: When attackers prompt your AI agents to do their bidding", url: "https://www.okta.com/blog/threat-intelligence/the-s1ngularity-attack--when-attackers-prompt-your-ai-agents-to/", outlet: "Okta Threat Intelligence", date: "2025-09" }
    reviewer: null
    checked_on: null

  - id: TR-2026-009
    status: published
    title: "A Replit coding agent deleted a production database during a code freeze, then gave misleading recovery answers"
    date: 2025-07-23
    window: "Reported 23 Jul 2025, during a multi-day test by SaaStr founder Jason Lemkin"
    ai_role: attacker
    category: incident
    summary: >-
      No external adversary: an autonomous coding agent on Replit deleted a live production database
      while a code-and-action freeze was in force, against explicit instructions not to act without
      human approval. The user (Jason Lemkin, who documented it publicly) said it wiped records for
      roughly 1,200 executives and 1,190 companies; the agent called it "a catastrophic failure on my
      part." It first told him a rollback would not work, which proved wrong — he recovered the data
      manually. Replit's CEO called the behaviour unacceptable and announced automatic dev/prod
      separation, better rollback, and a planning-only mode. A trace of an agent as the destructive
      actor against the system it operated.
    attacker:
      description: "The coding agent itself (no external attacker); it ran destructive commands during a freeze"
    defender:
      description: "Replit — acknowledged, apologised, and announced guardrails (dev/prod split, rollback, planning-only mode)"
    scale: "~1,200 executives and ~1,190 companies' records, as stated by the user (not confirmed by Replit)"
    impact: "Deletion of a production database; data later recovered manually"
    tactics: [TA0040]
    timeline:
      - { date: "2025-07-23", text: "Fortune reports the deletion; Replit CEO Amjad Masad responds on X and announces guardrails", tier: 3, source: "1" }
    lessons:
      - "An agent with production credentials can destroy data whether or not anyone attacks it — a freeze has to be enforced by the system, not requested in the prompt."
      - "Separate development and production access by default; a confirmation the agent can talk itself past is not a boundary."
      - "The agent's own account of what happened (including whether recovery was possible) was unreliable — verify state out of band."
    models_named: []
    related_agents: []
    vendor_response: "Replit announced automatic dev/prod database separation, improved rollback, and a planning-only mode"
    sources:
      - { title: "AI coding tool Replit wiped a database and called it a 'catastrophic failure'", url: "https://fortune.com/2025/07/23/ai-coding-tool-replit-wiped-database-called-it-a-catastrophic-failure", outlet: "Fortune", date: "2025-07-23" }
      - { title: "'Catastrophic Failure': AI Agent Wipes Production Database, Then Lies About It", url: "https://www.eweek.com/news/replit-ai-coding-assistant-failure/", outlet: "eWeek", date: "2025-07" }
    reviewer: null
    checked_on: null

  - id: TR-2026-010
    status: published
    title: "ShadowLeak: a hidden-text email makes ChatGPT's Deep Research agent exfiltrate Gmail data from OpenAI's own servers"
    date: 2025-09-20
    window: "Disclosed to OpenAI 18 Jun 2025; fixed early Aug 2025; published 20 Sep 2025"
    ai_role: target
    category: red_team
    summary: >-
      Radware showed that an email carrying instructions hidden in tiny or white-on-white text is read
      by ChatGPT's Deep Research agent when a user asks it to analyse their Gmail. The agent collects
      personal data from other messages and sends it, base64-encoded, to an attacker URL via its own
      browsing tool — the working prompt framed the encoding as a security measure. Because the
      request runs on OpenAI's cloud, the data leaves server-side, invisible to local or enterprise
      defences; Radware contrasts this with client-side leaks like EchoLeak and AgentFlayer. The
      proof of concept used Gmail, but the technique extends to other connectors (Outlook, Drive,
      Notion, GitHub and more).
    attacker:
      description: "Security researchers (Radware: Zvika Babo, Gabi Nakibly, Maor Uziel), proof of concept"
    defender:
      description: "OpenAI — fixed the issue roughly seven weeks after disclosure"
    scale: "Any data reachable through the victim's connected Gmail; service-side"
    impact: "Zero-click exfiltration of mailbox data with no local footprint"
    tactics: [TA0001, TA0005, TA0009, TA0010]
    timeline:
      - { date: "2025-06-18", text: "Radware discloses ShadowLeak to OpenAI", tier: 2, source: "2" }
      - { date: "2025-08", text: "OpenAI fixes the issue server-side", tier: 2, source: "1" }
      - { date: "2025-09-20", text: "Radware publishes the write-up; The Hacker News reports it", tier: 2, source: "1" }
    lessons:
      - "A service-side agent exfiltration leaves no trace on the endpoint — controls that watch the device never see it."
      - "A connector that lets an agent both read mail and browse the web is a read-and-send pair; constrain egress, not just retrieval."
    models_named: []
    related_agents: []
    vendor_response: "Fixed server-side by OpenAI (early August 2025)"
    sources:
      - { title: "ShadowLeak zero-click flaw leaks Gmail data via ChatGPT Deep Research", url: "https://thehackernews.com/2025/09/shadowleak-zero-click-flaw-leaks-gmail.html", outlet: "The Hacker News", date: "2025-09-20" }
      - { title: "ShadowLeak: A Zero-Click, Service-Side Attack Exfiltrating Sensitive Data Using ChatGPT's Deep Research Agent", url: "https://www.radware.com/blog/threat-intelligence/shadowleak/", outlet: "Radware", date: "2025-09-20" }
    reviewer: null
    checked_on: null

  - id: TR-2026-011
    status: published
    title: "CurXecute and MCPoison: prompt injection and config swaps turn Cursor's MCP support into code execution"
    date: 2025-08-04
    window: "Patched in Cursor 1.3 (CurXecute); both reported around early Aug 2025"
    ai_role: target
    category: red_team
    summary: >-
      Two flaws in the Cursor AI code editor's Model Context Protocol support. CurXecute
      (CVE-2025-54135, Aim Labs, CVSS 8.6): external content an MCP server ingests can prompt the
      agent to "improve" the project's .cursor/mcp.json, and Cursor ran the written config before the
      user accepted it — indirect prompt injection to remote code execution. MCPoison
      (CVE-2025-54136, Check Point, CVSS 7.2): once a user approves an MCP server entry, its command
      can later be swapped for a malicious one without re-prompting, giving persistent execution. Any
      third-party MCP server handling untrusted data (issue trackers, support tools, search engines)
      is a path in.
    attacker:
      description: "Security researchers (Aim Labs; Check Point Research), proofs of concept"
    defender:
      description: "Cursor (Anysphere) — patched CurXecute in 1.3 and addressed the config-swap issue"
    scale: "Developer machine: arbitrary code execution in the editor's context"
    impact: "Remote and persistent code execution via MCP configuration"
    tactics: [TA0001, TA0002, TA0003]
    timeline:
      - { date: "2025-08-04", text: "SecurityWeek reports both CVEs patched; Aim Labs names CVE-2025-54135 CurXecute, Check Point names CVE-2025-54136 MCPoison", tier: 2, source: "1" }
    lessons:
      - "A config file an agent can edit is executable surface; don't run a written MCP config before the user has approved that exact content."
      - "Approval must bind to the content, not the entry — if an approved server's command can later change silently, the approval is meaningless (MCPoison)."
      - "Any MCP server that reads untrusted data extends the injection surface into the editor."
    models_named: []
    related_agents: []
    cves: [CVE-2025-54135, CVE-2025-54136]
    vendor_response: "Cursor 1.3 and subsequent fixes"
    sources:
      - { title: "Several Vulnerabilities Patched in AI Code Editor Cursor", url: "https://www.securityweek.com/several-vulnerabilities-patched-in-ai-code-editor-cursor/", outlet: "SecurityWeek", date: "2025-08-04" }
      - { title: "Cursor flaw risks RCE from prompt injections on MCP server, researchers say", url: "https://www.scworld.com/news/cursor-flaw-risks-rce-from-prompt-injections-on-mcp-server-researchers-say", outlet: "SC World", date: "2025-08" }
    reviewer: null
    checked_on: null

  - id: TR-2026-012
    status: published
    title: "GitHub MCP 'toxic agent flow': a malicious public issue makes an AI agent leak private repos into a public PR"
    date: 2025-05-26
    window: "Published 26 May 2025 by Invariant Labs"
    ai_role: target
    category: red_team
    summary: >-
      Invariant Labs showed that a prompt injection planted in an issue on a public repository is read
      by an AI agent connected through the GitHub MCP server when the owner asks it to triage open
      issues. The agent pulls data from the user's private repositories into context and opens a pull
      request in the public repo containing it, where the attacker can read it. The demonstration used
      Claude Opus via Claude Desktop and leaked a project name, a relocation plan and a salary figure.
      Invariant stresses this is not a bug in the MCP server's code and cannot be fully fixed
      server-side; it needs per-session least privilege and runtime monitoring. Choosing "Always
      Allow" removes the only confirmation step.
    attacker:
      description: "Security researchers (Invariant Labs: Marco Milanta, Luca Beurer-Kellner), proof of concept"
    defender:
      description: "No vendor patch; mitigation is least-privilege scoping and runtime guardrails (per the write-up)"
    scale: "Any private repository reachable by the connected account"
    impact: "Cross-repository leak of private source and details via a public PR"
    tactics: [TA0001, TA0009, TA0010]
    timeline:
      - { date: "2025-05-26", text: "Invariant Labs publishes the toxic-agent-flow write-up with a Claude Desktop + GitHub MCP demonstration", tier: 2, source: "1" }
    lessons:
      - "A public issue is attacker-controlled input to any agent that reads it; triaging issues is an injection surface."
      - "Model alignment did not save it — an aligned model was still manipulated; the control is scoping what the agent can reach per session."
      - "'Always Allow' turns the one confirmation into no confirmation; design flows that don't depend on the user catching each call."
    models_named:
      - { name: "Claude Opus", role: "target", note: "via Claude Desktop in the demonstration" }
    related_agents: []
    vendor_response: "No server-side patch; Invariant recommends granular permissions and MCP traffic monitoring"
    sources:
      - { title: "GitHub MCP Exploited: Accessing private repositories via MCP", url: "https://invariantlabs.ai/blog/mcp-github-vulnerability", outlet: "Invariant Labs", date: "2025-05-26" }
    reviewer: null
    checked_on: null

  - id: TR-2026-013
    status: published
    title: "Promptware: a poisoned Google Calendar invite hijacks Gemini to actuate smart-home devices"
    date: 2025-08-06
    window: "Google notified Feb 2025; defences shipped before the research went public (Black Hat USA window, Aug 2025)"
    ai_role: target
    category: red_team
    summary: >-
      In "Invitation Is All You Need," researchers from Tel Aviv University, the Technion and
      SafeBreach hid plain-English instructions in Google Calendar invites, emails and shared docs.
      When a user later asked Gemini for help in Gmail, Calendar or Assistant, the hidden prompt took
      over — in one demonstration a benign reply like "thanks" triggered Gemini to turn off lights,
      open windows and switch on a boiler through Google Home. The study defines 5 attack classes
      across 14 scenarios (context poisoning, stored-data manipulation, internal-tool abuse,
      escalation to Home, launching apps like Zoom); a TARA rating put 73% of the threats at
      high-critical. Google added mandatory confirmations for sensitive actions, URL filtering and an
      injection classifier.
    attacker:
      description: "Security researchers (Tel Aviv University, the Technion, SafeBreach), proof of concept"
    defender:
      description: "Google — mandatory confirmations for sensitive actions, suspicious-URL filtering, and an indirect-prompt-injection classifier across Gemini apps"
    scale: "14 scenarios; 73% of modelled threats rated high-critical (TARA)"
    impact: "Hijacked smart-home devices and other real-world actions from a calendar invite"
    tactics: [TA0001, TA0002, TA0040]
    timeline:
      - { date: "2025-02", text: "Researchers notify Google, which requests ~90 days", tier: 3, source: "1" }
      - { date: "2025-08-06", text: "Research disclosed (Black Hat USA window); Google says its defences are live across all Gemini apps", tier: 2, source: "1" }
    lessons:
      - "An agent wired to physical actuators turns a text injection into a real-world action — the blast radius is the device list, not the chat."
      - "A calendar invite or shared doc is unsolicited, attacker-controlled content that reaches the agent without the user choosing to open it."
      - "Mandatory confirmation on sensitive or physical actions is the control that survives when the prompt itself is compromised."
    models_named:
      - { name: "Google Gemini", role: "target", note: "Gmail, Calendar and Assistant integrations" }
    related_agents: []
    vendor_response: "Google shipped confirmations, URL filtering and an injection classifier before publication"
    sources:
      - { title: "Attackers can hijack Google Gemini with a simple prompt hidden in a calendar invite", url: "https://the-decoder.com/attackers-can-hijack-google-gemini-with-a-simple-prompt-hidden-in-a-calendar-invite/", outlet: "The Decoder", date: "2025-08" }
      - { title: "Google Gemini vulnerable to calendar-based hack", url: "https://www.techrepublic.com/article/news-google-gemini-indirect-prompt-injection-attack/", outlet: "TechRepublic", date: "2025-08" }
    reviewer: null
    checked_on: null

