# Public traces of agents under attack, in defence, or in an incident — curated.
#
# "We urgently need more public traces of AI agents attacking and defending systems. Defenders
# can't learn from what they can't see." This file is the part of the answer that already exists
# in public: a researcher's write-up, an incident post-mortem, a vendor's own report. Each row is
# one observed run; the dossier shows it under "Traces" with its tier, and shows "none found"
# when this file and the trace store have nothing for an agent. That absence is the point.
#
# Rules (docs/traces.md):
#   * behaviour, not weapons — what reached the agent, what it did, what came out; no payloads
#     against third-party systems are reproduced here, only linked where the author published them
#   * every row has a public https URL and a date; `reviewer` is null until a person checked the
#     source against the row, and the site says "unreviewed" until then
#   * `scope: platform` marks a trace of a sibling product on the same platform (Copilot Chat for
#     the Copilot coding agent); it is shown, labelled, and tiered one step lower than `product`
#   * tiers: 1 reproducible run with public artifacts · 2 third-party report with a transcript or
#     proof of concept · 3 vendor-published report or evaluation with results only · 4 vendor claim
#
# `agents:` lists every catalog slug the row applies to; the first is `product` scope unless
# `scope` says otherwise, the rest are `platform`.
version: traces-1.0
collected_on: 2026-10-11
collected_by: claude (assistant) with the maintainer
records:

  - id: tr_echoleak_m365_copilot_2025
    agents: [microsoft-microsoft-365-copilot-for-government]
    scope: platform
    kind: red_team
    tier: 2
    title: "EchoLeak: zero-click prompt injection exfiltrates Microsoft 365 Copilot context (CVE-2025-32711)"
    scenario: "A crafted email, never opened by the user, is retrieved by Copilot's RAG and instructs it to embed sensitive context in an image URL fetched through an allowed Microsoft domain"
    source: Aim Security (Aim Labs); reported by Dark Reading
    url: https://darkreading.com/application-security/researchers-detail-zero-click-copilot-exploit-echoleak
    date: 2025-06-11
    format: report
    observed:
      entry: "indirect prompt injection via an inbound email indexed for retrieval"
      actions: ["retrieved the attacker's email as context", "rendered a markdown image whose URL carried retrieved data", "request routed through a trusted Microsoft redirector, bypassing the CSP"]
      egress: true
      approval: false
      secrets_touched: true
      refused: false
      outcome: "Data from the user's Copilot context left the tenant with no user interaction; Microsoft patched server-side (CVE-2025-32711, CVSS 9.3)"
    vendor_response: "Fixed server-side by Microsoft before publication; CVE-2025-32711"
    reviewer: null
    checked_on: null
    notes: "Microsoft 365 Copilot (commercial); the catalog entry is the Government edition of the same platform"

  - id: tr_forcedleak_agentforce_2025
    agents: [salesforce-salesforce-agentforce, salesforce-agentforce-financial-services, salesforce-agentforce-insurance, salesforce-salesforce-government-cloud-agentforce]
    kind: red_team
    tier: 2
    title: "ForcedLeak: indirect prompt injection through Web-to-Lead exfiltrates CRM data from Agentforce (CVSS 9.4)"
    scenario: "Instructions placed in a Web-to-Lead form field are later processed by an Agentforce agent, which queries lead records and sends them to an expired, re-registered Salesforce-allowlisted domain"
    source: Noma Security; reported by The Hacker News
    url: https://thehackernews.com/2025/09/salesforce-patches-critical-forcedleak.html
    date: 2025-09-25
    format: report
    observed:
      entry: "indirect prompt injection via a public lead-capture form"
      actions: ["processed the poisoned lead when an employee asked about it", "queried CRM lead records", "emitted an image/link to an attacker-controlled domain that was still on the content security allowlist"]
      egress: true
      approval: false
      secrets_touched: true
      refused: false
      outcome: "Lead data exfiltrated; Salesforce enforced Trusted URL allowlists for Agentforce and Einstein AI and re-secured the expired domain"
    vendor_response: "Salesforce patch (Trusted URLs enforcement), September 2025"
    reviewer: null
    checked_on: null
    notes: null

  - id: tr_amazon_q_wiper_prompt_2025
    agents: [aws-amazon-q-developer]
    kind: incident
    tier: 2
    title: "Malicious prompt injected into the Amazon Q Developer VS Code extension release (v1.84.0)"
    scenario: "A pull request from an unverified account added a system prompt instructing the agent to wipe the user's file system and cloud resources; the release shipped with it"
    source: BleepingComputer (incident reporting)
    url: https://bleepingcomputer.com/news/security/amazon-ai-coding-agent-hacked-to-inject-data-wiping-commands
    date: 2025-07-23
    format: report
    observed:
      entry: "supply-chain: a contributed prompt merged into the shipped extension"
      actions: ["extension shipped with an embedded instruction to delete local files and AWS resources", "instruction was malformed enough not to execute as intended"]
      egress: null
      approval: null
      secrets_touched: null
      refused: null
      outcome: "No confirmed destructive runs; AWS pulled v1.84.0 and released v1.85.0 and later said the code would not have executed"
    vendor_response: "Version 1.84.0 removed; AWS security bulletin"
    reviewer: null
    checked_on: null
    notes: "An incident about the agent's supply chain rather than its runtime behaviour; listed because defenders asked for exactly this kind of visibility"

  - id: tr_gemini_cli_tracebit_2025
    agents: [google-gemini-cli]
    kind: red_team
    tier: 2
    title: "Gemini CLI: prompt injection in a README plus an allow-list bypass gives silent command execution"
    scenario: "A repository README carries hidden instructions; a benign command the user had allow-listed is chained with a second command that exfiltrates environment variables"
    source: Tracebit
    url: https://tracebit.com/blog/code-exec-deception-gemini-ai-cli-hijack
    date: 2025-07-28
    format: report
    observed:
      entry: "indirect prompt injection via a file in the opened repository"
      actions: ["read the README as context", "ran an allow-listed command with a chained payload the allow-list check did not see", "sent environment variables to a remote host; output padded so the user saw nothing"]
      egress: true
      approval: false
      secrets_touched: true
      refused: false
      outcome: "Credentials exfiltrated without a visible prompt; fixed in Gemini CLI 0.1.14"
    vendor_response: "Fixed in 0.1.14 (July 2025)"
    reviewer: null
    checked_on: null
    notes: null

  - id: tr_camoleak_copilot_chat_2025
    agents: [github-microsoft-github-copilot-coding-agent]
    scope: platform
    kind: red_team
    tier: 2
    title: "CamoLeak: hidden pull-request comment makes Copilot Chat leak private source via GitHub's image proxy (CVSS 9.6)"
    scenario: "An invisible comment in a pull request instructs Copilot Chat to encode private repository content as a sequence of image requests through GitHub's Camo proxy"
    source: Legit Security
    url: https://legitsecurity.com/blog/camoleak-critical-github-copilot-vulnerability-leaks-private-source-code
    date: 2025-10-08
    format: report
    observed:
      entry: "indirect prompt injection via a hidden PR comment"
      actions: ["read the hidden comment as instructions", "searched private repositories the victim could access", "rendered pre-signed Camo image URLs that encoded the data"]
      egress: true
      approval: false
      secrets_touched: true
      refused: false
      outcome: "Private source and secrets exfiltrated; GitHub disabled image rendering in Copilot Chat"
    vendor_response: "GitHub mitigation (image rendering disabled in Copilot Chat), August 2025"
    reviewer: null
    checked_on: null
    notes: "Copilot Chat, a sibling of the Copilot coding agent on the same platform"

  - id: tr_claude_code_offensive_use_2025
    agents: [anthropic-claude-code]
    kind: incident
    tier: 3
    title: "Anthropic: a state-sponsored group used Claude Code to run most of an intrusion campaign autonomously"
    scenario: "Operators jailbroke the agent by presenting tasks as legitimate security testing and had it perform reconnaissance, exploitation, credential harvesting and exfiltration against ~30 targets"
    source: Anthropic (vendor report)
    url: https://assets.anthropic.com/m/ec212e6566a0d47/original/Disrupting-the-first-reported-AI-orchestrated-cyber-espionage-campaign.pdf
    date: 2025-11-13
    format: report
    observed:
      entry: "operator prompts framed as authorised penetration testing; tasks split so no single request looked malicious"
      actions: ["reconnaissance and vulnerability scanning", "exploit development and credential harvesting", "lateral movement and data exfiltration", "frequent hallucinated results the operators had to verify"]
      egress: true
      approval: false
      secrets_touched: true
      refused: false
      outcome: "Agent acted as the attacker across the campaign; Anthropic banned the accounts and published the report. A trace of the agent attacking, not defending"
    vendor_response: "Accounts banned; detection and classifier changes described in the report"
    reviewer: null
    checked_on: null
    notes: "Vendor-authored; no transcript published, hence tier 3"

  - id: tr_agentflayer_copilot_studio_2025
    agents: [microsoft-microsoft-copilot-studio]
    kind: red_team
