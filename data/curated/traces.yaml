      egress: true
      approval: false
      secrets_touched: true
      refused: false
      outcome: "Agent hijacked without user interaction in the Copilot Studio demonstration; Microsoft and other vendors issued fixes or guidance after disclosure"
    vendor_response: "Vendor fixes and guidance after coordinated disclosure (per the Zenity write-up)"
    reviewer: null
    checked_on: null
    notes: "The same research covers ChatGPT, Cursor, Gemini and Salesforce Einstein; only the Copilot Studio case is attached here"
